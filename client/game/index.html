<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>AirSports Tennis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Barlow+Semi+Condensed:ital,wght@0,600;1,700;1,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/game/style.css" />
  </head>
  <body>
    <div id="lobby" class="lobby">
      <div class="sky"></div>
      <div class="grass"></div>

      <header class="brand">
        <h1>AirSports <span>Tennis</span></h1>
        <p>Your phone is the racquet</p>
      </header>

      <main class="arena">
        <section class="side" id="player-side">
          <div class="figure" id="player-figure">
            <div class="silhouette"></div>
          </div>
          <div class="tag">
            <span class="face" id="player-face"></span>
            <span class="tag-name">Player 1</span>
          </div>
          <p class="side-status" id="player-status">Waiting for phone…</p>
        </section>

        <section class="join-card">
          <p class="join-title">Scan to join</p>
          <canvas id="qr" width="220" height="220" aria-label="QR code to join"></canvas>
          <div class="code-row">
            <span class="code-label">Room</span>
            <span id="room-code" class="code">····</span>
          </div>
          <p id="join-url" class="url">connecting…</p>
          <p id="warning" class="warning" hidden></p>
        </section>

        <section class="side ready" id="cpu-side">
          <div class="figure" id="cpu-figure"></div>
          <div class="tag">
            <span class="face" id="cpu-face"></span>
            <span class="tag-name">Computer</span>
          </div>
          <p class="side-status">Ready</p>
        </section>
      </main>

      <footer class="footer">
        <button id="start-btn" class="start-btn" disabled>Start</button>
        <p id="status" class="status">Connecting to server…</p>
      </footer>
    </div>

    <div id="game" class="game" hidden></div>

    <script type="module" src="/game/main.ts"></script>
  </body>
</html>
